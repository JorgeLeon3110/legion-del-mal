# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion 


on:
  workflow_dispatch:
    inputs:
      villano:
        description: " Que villano envia el mensaje?"
        required: true
        type: choise
        options: 
          - Lex
          - Magneto
          - Jocker
          - Mystique


jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
