name: Reclutamiento de Agente

on: push 

jobs:
  reporte-de-Reclutamiento:
    runs-on: ubuntu-latest

    steps:
      - name: El agente se presenta
        run: echo "Soy Lex y lider de la legion del mal"
      - name: Fin del agente
        run: echo "fin de la presentacion"
      - name: Reporte de identidad
        run: | 
          echo "Reporte de identidad"
          echo "===================="
          echo " "
          echo " Nombre clave: ${{ github.actor}}"
          echo " "
          echo " Contexto de github  "
          echo " Repo ${{ github.repository}}  "
          echo " Operacion ${{ github.sha}}  "
          echo " Operacion ${{ toJson(github)}}  "

      - name: Capacidades del agente 
        run: | 
          echo "Capacidades detectadas"
          echo "Sitema operativo "
          uname -a 
          echo "Habilidades tecnicas"
          node --version
          git --version 
          python3 --version 
      
      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"
          ls /

